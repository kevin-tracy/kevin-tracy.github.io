<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Lift</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--fg:#e8eaed;--mut:#8b919c;--acc:#4f8cff;--ok:#2fbf71;--okbg:#14301f;--bad:#e5484d;--r:12px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:4px 0 16px;min-height:40px}
header h1{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.back{font-size:24px;width:40px;height:40px;flex:none;border-radius:50%;background:var(--card);display:grid;place-items:center;padding-bottom:3px}
.sync{font-size:12px;color:var(--mut)}
.sync.pend{color:#f5a524}
.card{display:block;background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.card .day{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.card .t{font-weight:600;margin:2px 0}
.card .s{font-size:13px;color:var(--mut)}
.banner{background:var(--acc);color:#fff}
.banner .day,.banner .s{color:#dbe6ff}
.btn{display:block;width:100%;padding:14px;border-radius:var(--r);font-weight:600;text-align:center;background:var(--card)}
.btn.pri{background:var(--acc);color:#fff}
.btn.ok{background:var(--ok);color:#06210f}
.btn.danger{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
ul.ex{list-style:none;padding:0}
ul.ex li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
ul.ex li span:last-child{color:var(--mut);white-space:nowrap}
.note{font-size:12px;color:var(--mut);margin-top:2px}
/* workout */
.exc{background:var(--card);border-radius:var(--r);padding:14px 12px 8px;margin-bottom:12px}
.exc.skipped{opacity:.45}
.exh{display:flex;align-items:flex-start;gap:8px;padding:0 4px 8px}
.exh .t{font-weight:600;flex:1}
.exh .tgt{font-size:13px;color:var(--mut)}
.skip{font-size:13px;color:var(--mut);padding:4px 8px;border:1px solid var(--line);border-radius:8px}
.set{display:grid;grid-template-columns:28px 1fr 76px 60px 44px;gap:6px;align-items:center;padding:4px;border-radius:8px}
.set.hd{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.set.hd>*:nth-child(n+3){text-align:center}
.set.time{grid-template-columns:28px 1fr 136px 44px}
.set.done{background:var(--okbg)}
.set .n{color:var(--mut);text-align:center;font-size:14px}
.set .p{color:var(--mut);font-size:14px}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 4px;width:100%;text-align:center;-moz-appearance:textfield}
input::-webkit-inner-spin-button{-webkit-appearance:none}
input:focus{outline:none;border-color:var(--acc)}
.set.done input{background:transparent;border-color:transparent}
.chk{width:40px;height:36px;border-radius:8px;background:var(--line);font-size:18px;color:var(--mut)}
.set.done .chk{background:var(--ok);color:#06210f}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.foot>div{max-width:528px;margin:0 auto}
/* edit */
.ed{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px}
.ed .top{display:flex;gap:6px;margin-bottom:8px}
.ed .top input{text-align:left;padding:8px 10px;font-weight:600}
.ed .ic{width:36px;flex:none;border-radius:8px;background:var(--line);color:var(--mut)}
.ed .ic.del{color:var(--bad)}
.ed .f{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ed label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;display:block}
.ed select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 4px;width:100%}
.btn.link{background:none;color:var(--mut);font-weight:400;font-size:14px;margin-top:24px}
.btn:disabled{opacity:.4}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:500;margin:28px 0 10px}
.btn+.btn,.card+.btn{margin-top:10px}
p.s,.sub{color:var(--mut);font-size:14px}
.sub{margin:-8px 0 8px}
.signin{min-height:80vh;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center}
.signin h1{font-size:28px}
.signin .s{color:var(--mut);font-size:14px;min-height:1em;max-width:280px}
.ed.rt{display:grid;gap:8px}
.ed.rt input{text-align:left;padding:8px 10px}
.ed .f2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
/* ---------- storage ----------
   Everything is cached in localStorage so the page renders instantly and works
   offline. Finished workouts go into an outbox that is only cleared after the
   API confirms the write; retries are safe because rows carry a workout id. */
const API = location.hostname==="localhost" ? "http://127.0.0.1:8787" : "https://lift-api.kevt-laser.workers.dev";
const CLIENT_ID = "634279737389-s25tjhmhkc3ncs3uddvd309gat185016.apps.googleusercontent.com";
const K = {routines:"lift.routines", log:"lift.log", active:"lift.active", outbox:"lift.outbox", token:"lift.token", dirty:"lift.dirty", me:"lift.me", users:"lift.users"};
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
const clearAll = () => { try{ Object.keys(localStorage).filter(k=>k.startsWith("lift.")&&k!=="lift.v").forEach(k=>localStorage.removeItem(k)); }catch{} };
// v3 = per-user data. Anything cached by a signed-out visitor belonged to the old public view.
if(ls.get("lift.v")!==3){ if(!ls.get(K.token)) clearAll(); ls.set("lift.v",3); }

async function api(path, method="GET", body){
  const h={}, tok=ls.get(K.token);
  if(tok) h.authorization="Bearer "+tok;
  if(body) h["content-type"]="application/json";
  const r=await fetch(API+path, {method, headers:h, body:body&&JSON.stringify(body)});
  if(r.status===401){ ls.del(K.token); render(); throw "auth"; }
  if(!r.ok) throw "http";
  return r.json();
}

/* ---------- sign in ----------
   Google's button proves who you are; the API checks the email is on the list
   and hands back a long-lived device token, so sign-in happens once per device. */
let gisP=null;
const loadGis=()=>gisP||=new Promise((res,rej)=>{ const s=document.createElement("script");
  s.src="https://accounts.google.com/gsi/client"; s.onload=res; s.onerror=()=>{gisP=null; rej();}; document.head.append(s); });
async function mountSignin(){
  const msg=t=>{ const el=$("#gmsg"); if(el) el.textContent=t; };
  try{ await loadGis(); }catch{ return msg("Couldn't load Google sign-in."); }
  const el=$("#gbtn"); if(!el) return;
  google.accounts.id.initialize({client_id:CLIENT_ID, callback:async ({credential})=>{
    msg("Checking…");
    try{ const {token}=await api("/login","POST",{credential}); clearAll(); ls.set(K.token,token); location.hash="#/"; render(); sync(); }
    catch{ msg("This Google account isn't on the list. Ask Kevin to add you."); }
  }});
  google.accounts.id.renderButton(el, {theme:"filled_black", size:"large", shape:"pill"});
}
function signOut(){
  const n=ls.get(K.outbox,[]).length;
  if(n && !confirm(`${n} sets haven't synced yet and will be lost. Sign out anyway?`)) return;
  api("/logout","POST").catch(()=>{}).finally(()=>{ clearAll(); routines=[]; log=[]; location.hash="#/"; render(); });
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const lo = r => parseInt(String(r).split("-")[0]) || 0;
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => v===""||v==null ? null : Number(v);
const fmtSet = x => x.skip ? "–" : x.t!=null ? `${x.t}s` : `${x.w ? x.w : "BW"}×${x.reps}`;
const target = e => { const n=e.n??e.sets; return e.kind==="time" ? `${n} sets` : `${n} × ${e.reps}`; };
const ago = d => { const n=Math.round((new Date(iso(new Date()))-new Date(d))/864e5); return n===0?"today":n===1?"yesterday":`${n} days ago`; };
const newId = () => "r"+Math.random().toString(36).slice(2,9);

let routines = ls.get(K.routines, []);
let log = ls.get(K.log, []);
const others = {};   // uid -> {routines, sets}, fetched on demand, read-only

// most recent non-skipped sets of an exercise (by name, across routines)
function previous(name, lg=log){
  let best=null;
  for(const x of lg) if(x.ex===name && !x.skip && (!best || x.d>best)) best=x.d;
  return best ? lg.filter(x=>x.ex===name && x.d===best && !x.skip).sort((a,b)=>a.s-b.s) : [];
}
const lastDone = (id, lg=log) => lg.reduce((m,x)=>x.r===id && x.d>m ? x.d : m, "");

/* ---------- sync ---------- */
let syncing=false, offline=false;
async function sync(){
  if(syncing || !ls.get(K.token)) return; syncing=true; paintSync();
  try{
    const ob=ls.get(K.outbox,[]);
    if(ob.length){ await api("/sets","POST",{rows:ob}); ls.set(K.outbox, ls.get(K.outbox,[]).slice(ob.length)); }
    if(ls.get(K.dirty)){ await api("/routines","PUT",{routines}); ls.del(K.dirty); }
    const [data, me, users] = await Promise.all([api("/data"), api("/me"), api("/users")]);
    if(!ls.get(K.dirty)) routines=data.routines;
    log=data.sets.concat(ls.get(K.outbox,[]));
    ls.set(K.routines,routines); ls.set(K.log,log); ls.set(K.me,me); ls.set(K.users,users); offline=false;
  }catch(e){ offline = e!=="auth"; }
  finally{
    syncing=false;
    // re-render with fresh data unless the user is typing (edit/workout state survives a re-render)
    if(!document.activeElement?.matches("input,select")) render(); else paintSync();
  }
}
function paintSync(){
  const el=$("#sync"); if(!el) return;
  const n=ls.get(K.outbox,[]).length;
  el.className="sync"+(n||offline?" pend":"");
  el.textContent = syncing ? "syncing…" : n ? `${n} sets unsynced` : offline ? "offline" : "";
}
addEventListener("online", sync);

async function loadOther(uid){
  try{ others[uid]=await api("/data?u="+uid); }catch{ others[uid]={error:true}; }
  if(location.hash.startsWith(`#/u/${uid}`)) render();
}

/* ---------- views ---------- */
const card = (r, href, lg) => { const l=lastDone(r.id, lg); return `<a class="card" href="${href}">
  ${r.day?`<div class="day">${esc(r.day)}</div>`:""}
  <div class="t">${esc(r.name)}${r.sub?` <span class="s">— ${esc(r.sub)}</span>`:""}</div>
  <div class="s">${r.ex.length} exercise${r.ex.length===1?"":"s"}${l?` · last ${ago(l)}`:""}</div></a>`; };
const exList = (r, lg) => `<ul class="ex">${r.ex.map(e=>{const p=previous(e.name, lg);
  return `<li><div>${esc(e.name)}<div class="note">${p.length?"last: "+p.map(fmtSet).join(", "):"no history"}</div></div><span>${target(e)}</span></li>`}).join("")
  || `<li><span class="note">No exercises yet.</span></li>`}</ul>`;

const views = {
  signin(){
    setTimeout(mountSignin);
    return `<div class="signin"><h1>Lift</h1><p class="s">Sign in to see and log your workouts.</p><div id="gbtn"></div><div class="s" id="gmsg"></div></div>`;
  },
  home(){
    const act=ls.get(K.active), me=ls.get(K.me), ar=act&&routines.find(r=>r.id===act.r);
    const people=ls.get(K.users,[]).filter(u=>!me||u.id!==me.id);
    return `<header><h1>Lift</h1><span id="sync" class="sync"></span></header>
    ${act?`<a class="card banner" href="#/w"><div class="day">In progress</div><div class="t">${esc(ar?ar.name:"Workout")}</div><div class="s">Tap to resume</div></a>`:""}
    ${routines.length||!syncing?"":`<p class="s">Loading…</p>`}
    ${routines.map(r=>card(r, `#/r/${r.id}`, log)).join("")}
    <button class="btn" data-a="newRoutine">+ Add routine</button>
    ${people.length?`<h2>Other lifters</h2>${people.map(u=>`<a class="card" href="#/u/${u.id}"><div class="t">${esc(u.name)}</div></a>`).join("")}`:""}
    <button class="btn link" data-a="signout">Sign out${me?` ${esc(me.name)}`:""}</button>`;
  },
  routine(id){
    const r=routines.find(r=>r.id===id); if(!r) return views.home();
    const act=ls.get(K.active);
    return `<header><a class="back" href="#/">‹</a><h1>${esc(r.name)}</h1></header>
    <div class="sub">${[r.day,r.sub].filter(Boolean).map(esc).join(" · ")}</div>
    ${exList(r, log)}
    <div class="row2"><a class="btn" href="#/r/${id}/edit">Edit</a>
    ${act&&act.r!==id?`<a class="btn" href="#/w">Resume other</a>`:`<button class="btn pri" data-a="start" data-id="${id}"${r.ex.length?"":" disabled"}>${act?"Resume":"Start"}</button>`}</div>`;
  },
  edit(id){
    const r=routines.find(r=>r.id===id);
    if(!(draft&&draft.id===id)){ if(!r) return views.home(); draft=JSON.parse(JSON.stringify(r)); }
    const isNew=!r;
    return `<header><a class="back" href="${isNew?"#/":`#/r/${id}`}">‹</a><h1>${isNew?"New routine":"Edit "+esc(r.name)}</h1></header>
    <div class="ed rt">
      <div><label>Name</label><input data-rf="name" value="${esc(draft.name)}" placeholder="e.g. Upper A"></div>
      <div class="f2">
        <div><label>Day</label><select data-rf="day"><option value="">No day</option>${DAYS.map(d=>`<option${draft.day===d?" selected":""}>${d}</option>`).join("")}</select></div>
        <div><label>Focus</label><input data-rf="sub" value="${esc(draft.sub)}" placeholder="optional"></div>
      </div>
    </div>
    ${draft.ex.map((e,i)=>`<div class="ed" data-i="${i}">
      <div class="top"><input data-f="name" value="${esc(e.name)}" placeholder="Exercise name">
        <button class="ic" data-a="up" ${i?"":"disabled"}>↑</button>
        <button class="ic del" data-a="del">✕</button></div>
      <div class="f">
        <div><label>Type</label><select data-f="kind"><option value="wr"${e.kind==="wr"?" selected":""}>Weight</option><option value="time"${e.kind==="time"?" selected":""}>Time</option></select></div>
        <div><label>Sets</label><input data-f="sets" type="number" inputmode="numeric" value="${e.sets}"></div>
        ${e.kind==="time"?"<div></div><div></div>":`<div><label>Reps</label><input data-f="reps" value="${esc(e.reps)}" placeholder="8-10"></div>
        <div><label>lbs</label><input data-f="w" type="number" inputmode="decimal" value="${e.w||""}" placeholder="BW"></div>`}
      </div>
    </div>`).join("")}
    <button class="btn" data-a="add">+ Add exercise</button>
    ${isNew?"":`<button class="btn danger" data-a="delRoutine">Delete routine</button>`}
    <div class="foot"><div><button class="btn pri" data-a="saveEdit">Save</button></div></div>`;
  },
  workout(){
    const a=ls.get(K.active); if(!a){ location.hash="#/"; return ""; }
    const r=routines.find(r=>r.id===a.r);
    return `<header><a class="back" href="#/">‹</a><h1>${esc(r?r.name:"Workout")}</h1><span id="sync" class="sync"></span></header>
    ${a.ex.map((e,i)=>{const t=e.kind==="time";return `<div class="exc${e.skipped?" skipped":""}" data-i="${i}">
      <div class="exh"><div class="t">${esc(e.name)}<div class="tgt">${target(e)}</div></div>
        <button class="skip" data-a="skip">${e.skipped?"Unskip":"Skip"}</button></div>
      <div class="set hd${t?" time":""}"><span>Set</span><span>Previous</span>${t?"<span>Sec</span>":"<span>lbs</span><span>Reps</span>"}<span></span></div>
      ${e.sets.map((s,j)=>`<div class="set${t?" time":""}${s.done?" done":""}" data-j="${j}">
        <span class="n">${j+1}</span><span class="p">${s.prev||"–"}</span>
        ${t?`<input data-f="t" type="number" inputmode="numeric" value="${s.t??""}">`
           :`<input data-f="w" type="number" inputmode="decimal" value="${s.w??""}" placeholder="BW"><input data-f="reps" type="number" inputmode="numeric" value="${s.reps??""}">`}
        <button class="chk" data-a="chk">✓</button></div>`).join("")}
    </div>`}).join("")}
    <button class="btn danger" data-a="discard">Discard workout</button>
    <div class="foot"><div><button class="btn ok" data-a="finish">Finish</button></div></div>`;
  },
  // read-only views of someone else
  other(uid, rid){
    const u=ls.get(K.users,[]).find(u=>u.id===uid), name=esc(u?u.name:"Lifter"), o=others[uid];
    if(!o){ loadOther(uid); }
    const body = !o ? `<p class="s">Loading…</p>` : o.error ? `<p class="s">Couldn't load.</p>` : null;
    if(rid){
      const r=o&&!o.error&&o.routines.find(r=>r.id===rid);
      return `<header><a class="back" href="#/u/${uid}">‹</a><h1>${r?esc(r.name):name}</h1></header>
      ${body || (r ? `<div class="sub">${name}${r.day?" · "+esc(r.day):""}</div>${exList(r, o.sets)}` : `<p class="s">Not found.</p>`)}`;
    }
    return `<header><a class="back" href="#/">‹</a><h1>${name}</h1></header>
    ${body || (o.routines.map(r=>card(r, `#/u/${uid}/r/${r.id}`, o.sets)).join("") || `<p class="s">No routines.</p>`)}`;
  }
};
let draft=null;

function render(){
  const m=(location.hash.slice(1)||"/").split("/").filter(Boolean);
  if(!(m[0]==="r"&&m[2]==="edit")) draft=null;
  $("#app").innerHTML =
    !ls.get(K.token) ? views.signin() :
    m[0]==="u" ? views.other(+m[1], m[2]==="r"?m[3]:null) :
    m[0]==="r" ? (m[2]==="edit"?views.edit(m[1]):views.routine(m[1])) :
    m[0]==="w" ? views.workout() : views.home();
  paintSync();
}
addEventListener("hashchange", ()=>{ render(); scrollTo(0,0); });

/* ---------- actions ---------- */
function startWorkout(id){
  if(ls.get(K.active)) return location.hash="#/w";
  const r=routines.find(r=>r.id===id);
  ls.set(K.active,{r:id, wid:crypto.randomUUID(), d:iso(new Date()), ex:r.ex.map(e=>{
    const p=previous(e.name);
    return {name:e.name, kind:e.kind, n:e.sets, reps:e.reps, w:e.w, skipped:false,
      sets:Array.from({length:e.sets},(_,j)=>{const q=p[j]||p[p.length-1];
        return e.kind==="time" ? {prev:p[j]?fmtSet(p[j]):"", t:q?q.t:null, done:false}
          : {prev:p[j]?fmtSet(p[j]):"", w:q?q.w:(e.w||null), reps:q?q.reps:lo(e.reps)||null, done:false};})};
  })});
  location.hash="#/w";
}

function finish(){
  const a=ls.get(K.active), rows=[];
  const open=a.ex.reduce((n,e)=>n+(e.skipped?0:e.sets.filter(s=>!s.done).length),0);
  if(open && !confirm(`${open} unchecked set${open>1?"s":""} will be logged as skipped. Finish?`)) return;
  a.ex.forEach(e=>e.sets.forEach((s,j)=>{
    const base={wid:a.wid, d:a.d, r:a.r, ex:e.name, s:j+1};
    rows.push(e.skipped||!s.done ? {...base, skip:true} : e.kind==="time" ? {...base, t:num(s.t)} : {...base, w:num(s.w)||0, reps:num(s.reps)});
  }));
  log=log.concat(rows); ls.set(K.log, log);
  ls.set(K.outbox, ls.get(K.outbox,[]).concat(rows));
  ls.del(K.active);
  location.hash="#/"; sync();
}

function saveRoutines(){ ls.set(K.routines,routines); ls.set(K.dirty,1); sync(); }

document.addEventListener("click", ev=>{
  const b=ev.target.closest("[data-a]"); if(!b) return;
  const act=b.dataset.a;
  if(act==="start") return startWorkout(b.dataset.id);
  if(act==="signout") return signOut();
  if(act==="newRoutine"){ draft={id:newId(), day:"", name:"", sub:"", ex:[]}; location.hash=`#/r/${draft.id}/edit`; return; }
  if(act==="finish") return finish();
  if(act==="discard"){ if(confirm("Discard this workout? Nothing will be saved.")){ ls.del(K.active); location.hash="#/"; } return; }
  if(location.hash.startsWith("#/w")){
    const a=ls.get(K.active), ex=a.ex[b.closest("[data-i]").dataset.i];
    if(act==="skip") ex.skipped=!ex.skipped;
    if(act==="chk"){ const row=b.closest("[data-j]"), s=ex.sets[row.dataset.j]; s.done=!s.done; row.classList.toggle("done",s.done); ls.set(K.active,a); return; }
    ls.set(K.active,a); return render();
  }
  if(draft){
    const i=+b.closest("[data-i]")?.dataset.i;
    if(act==="add") draft.ex.push({name:"", kind:"wr", sets:3, reps:"8-10", w:0});
    if(act==="del" && confirm(`Remove ${draft.ex[i].name||"exercise"}?`)) draft.ex.splice(i,1);
    if(act==="up") [draft.ex[i-1],draft.ex[i]]=[draft.ex[i],draft.ex[i-1]];
    if(act==="delRoutine"){
      const a=ls.get(K.active);
      if(a&&a.r===draft.id) return alert("Finish or discard the workout in progress first.");
      if(!confirm(`Delete ${draft.name||"this routine"}? Your logged lifts are kept.`)) return;
      routines=routines.filter(r=>r.id!==draft.id); draft=null; saveRoutines(); location.hash="#/"; return;
    }
    if(act==="saveEdit"){
      draft.name=draft.name.trim()||"Untitled routine"; draft.sub=draft.sub.trim();
      draft.ex=draft.ex.filter(e=>e.name.trim()).map(e=>({...e,name:e.name.trim(),sets:Math.max(1,+e.sets||1)}));
      routines = routines.some(r=>r.id===draft.id) ? routines.map(r=>r.id===draft.id?draft:r) : routines.concat(draft);
      const id=draft.id; draft=null; saveRoutines(); location.hash=`#/r/${id}`; return;
    }
    render();
  }
});
document.addEventListener("input", ev=>{
  const {f, rf}=ev.target.dataset; if(!f&&!rf) return;
  if(location.hash.startsWith("#/w")){
    const a=ls.get(K.active), i=ev.target.closest("[data-i]").dataset.i, j=ev.target.closest("[data-j]").dataset.j;
    a.ex[i].sets[j][f]=ev.target.value; ls.set(K.active,a); // saved on every keystroke
  } else if(draft){
    if(rf) draft[rf]=ev.target.value;
    else { draft.ex[ev.target.closest("[data-i]").dataset.i][f]=ev.target.value; if(f==="kind") render(); }
  }
});
document.addEventListener("focusin", ev=>{ if(ev.target.tagName==="INPUT" && ev.target.type==="number") ev.target.select(); });

sync(); render();   // sync first so the first paint knows it's loading
</script>
</body>
</html>
