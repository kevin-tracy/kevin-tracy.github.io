<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>CBCT Viewer</title>
<meta name="description" content="A dental cone-beam CT scan, volume rendered in the browser with WebGL2.">
<style>
  :root { color-scheme: dark; --bg:#0b0d10; --panel:rgba(21,24,29,.92); --line:#2a2f37; --text:#e6e8eb; --muted:#8b939e; --accent:#5aa9ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font:14px/1.35 -apple-system, system-ui, sans-serif; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #top { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 12px) 8px calc(env(safe-area-inset-left) + 12px);
    pointer-events:none; }
  #top a, #top button { pointer-events:auto; }
  #top a { color:var(--muted); text-decoration:none; font-size:13px; }
  #top .title { font-weight:600; }
  #top .sp { flex:1; }
  #stats { color:var(--muted); font:11px/1.3 ui-monospace, Menlo, monospace; text-align:right; white-space:pre; }
  #panel { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line);
    padding:10px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px);
    display:flex; flex-direction:column; gap:9px; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .seg { display:flex; background:#1b1f25; border:1px solid var(--line); border-radius:9px; padding:2px; }
  .seg button { flex:1; font:inherit; font-weight:500; color:var(--text); background:none; border:0; border-radius:7px; padding:7px 4px; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#04121f; }
  .row { display:flex; align-items:center; gap:10px; }
  .row label { color:var(--muted); font-size:12px; min-width:3.6em; }
  .row input[type=range] { flex:1; min-width:0; accent-color:var(--accent); height:28px; }
  .row .val { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; min-width:3em; text-align:right; }
  .btn { font:inherit; font-size:13px; color:var(--text); background:#1f242b; border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  .btn[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  #more { display:none; flex-direction:column; gap:6px; }
  #panel.open #more { display:flex; }
  #settings { display:flex; flex-direction:column; gap:6px; }
  #settings h3 { margin:0; font-size:12px; font-weight:600; color:var(--muted); }
  .opt { display:flex; align-items:baseline; gap:8px; width:100%; text-align:left; font:inherit; color:var(--text);
    background:#1b1f25; border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  .opt[aria-pressed="true"] { border-color:var(--accent); }
  .opt b { font-weight:600; min-width:4.2em; }
  .opt .d { color:var(--muted); font-size:12px; flex:1; }
  .opt .mb { font-variant-numeric:tabular-nums; font-size:13px; }
  .tag { font-size:10px; color:var(--accent); border:1px solid currentColor; border-radius:5px; padding:0 4px; margin-left:4px; }
  #sharpRow { color:var(--text); font-size:13px; gap:8px; }
  #layers { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { display:flex; align-items:center; gap:5px; font:inherit; font-size:12px; color:var(--muted); background:#1b1f25;
    border:1px solid var(--line); border-radius:14px; padding:4px 9px 4px 7px; }
  .chip i { width:9px; height:9px; border-radius:50%; opacity:.35; }
  .chip[aria-pressed="true"] { color:var(--text); border-color:#4a5260; }
  .chip[aria-pressed="true"] i { opacity:1; }
  #gearBtn { padding:4px 8px; display:flex; align-items:center; }
  .hint { color:var(--muted); font-size:12px; }
  [hidden] { display:none !important; }
  #status { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:var(--muted); text-align:center; padding:24px; pointer-events:none; white-space:pre-line; }
  #bar { width:min(260px, 70vw); height:4px; background:#1f242b; border-radius:2px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .1s; }
  @media (min-width:700px) { #panel { left:auto; right:16px; bottom:16px; width:380px; border:1px solid var(--line); border-radius:14px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="top">
  <span class="title">CBCT</span>
  <span class="sp"></span>
  <div id="stats"></div>
</div>

<div id="status"><span id="msg">Loading…</span><div id="bar"><i></i></div></div>

<div id="panel">
  <div class="seg" id="modes">
    <button data-mode="0" aria-pressed="true">Bone</button>
    <button data-mode="1">Teeth</button>
    <button data-mode="2">X-ray</button>
    <button data-mode="3">Slices</button>
  </div>
  <div class="seg" id="axes" hidden>
    <button data-axis="0" aria-pressed="true">Axial</button>
    <button data-axis="1">Coronal</button>
    <button data-axis="2">Sagittal</button>
  </div>
  <div id="layers" hidden></div>
  <div class="row" id="cutRow"><label for="cut">Cut</label><input id="cut" type="range" min="0" max="1" step="0.002" value="0"></div>
  <div class="row" id="sliceRow" hidden><label for="slice">Slice</label><input id="slice" type="range" min="0" max="1" step="0.001" value="0.5"></div>
  <div id="settings" hidden>
    <h3>Quality</h3>
    <div id="quality" style="display:flex;flex-direction:column;gap:6px"></div>
    <label class="row" id="sharpRow" hidden><input type="checkbox" id="sharp"> Sharp: render at full screen resolution (slower)</label>
  </div>
  <div id="more">
    <div class="row"><label for="lo">Min</label><input id="lo" type="range" min="-500" max="2600" step="10"><span class="val" id="loV"></span></div>
    <div class="row"><label for="hi">Max</label><input id="hi" type="range" min="-500" max="2600" step="10"><span class="val" id="hiV"></span></div>
    <div class="row" id="shadeRow"><label for="shade">Shading</label><input id="shade" type="range" min="0" max="1" step="0.05"><span class="val"></span></div>
    <div class="hint" id="hint"></div>
  </div>
  <div class="row">
    <button class="btn" id="moreBtn" aria-pressed="false">Adjust</button>
    <button class="btn" id="gearBtn" aria-pressed="false" aria-label="Settings" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <span class="sp" style="flex:1"></span>
    <button class="btn" id="resetBtn">Reset view</button>
  </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
